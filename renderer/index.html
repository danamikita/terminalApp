<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Folders</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <span>Folders</span>
        <button id="add-folder-btn" title="Add folder">+</button>
      </div>
      <div id="folder-list"></div>
    </div>
    <div id="main">
      <div id="main-toolbar">
        <button id="split-toggle" title="Toggle split view">⬓ Split view</button>
      </div>
      <div id="main-body">
        <div id="slot-files" class="slot">
          <div id="files-empty" class="pane-empty">Click <strong>Files</strong> under a folder to browse it.</div>
          <div id="file-browser" class="pane"></div>
          <div id="markdown-preview" class="pane"></div>
        </div>
        <div id="slot-terminal" class="slot">
          <div id="terminal-empty" class="pane-empty">Select a session, or create one with the <strong>+</strong> next to a folder.</div>
          <div id="terminals"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-label"></div>
      <input id="modal-input" type="text" />
      <div id="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
