<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Folders</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <span>Folders</span>
        <button id="add-folder-btn" title="Add folder">+</button>
      </div>
      <div id="folder-list"></div>
    </div>
    <div id="main">
      <div id="main-toolbar">
        <button id="feedback-btn" class="toolbar-btn" title="Report a problem or suggest something">🐛 Feedback</button>
        <button id="split-toggle" class="toolbar-btn" title="Toggle split view">⬓ Split view</button>
      </div>
      <div id="main-body">
        <div id="slot-files" class="slot">
          <div id="files-empty" class="pane-empty">Click <strong>Files</strong> under a folder to browse it.</div>
          <div id="file-browser" class="pane"></div>
          <div id="markdown-preview" class="pane"></div>
        </div>
        <div id="slot-terminal" class="slot">
          <div id="terminal-empty" class="pane-empty">Select a session, or create one with the <strong>+</strong> next to a folder.</div>
          <div id="terminals"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-label"></div>
      <input id="modal-input" type="text" />
      <div id="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="feedback-overlay" class="hidden">
    <div id="feedback-modal">
      <div id="feedback-title-bar">Send Feedback</div>

      <label class="feedback-label" for="feedback-type">Type</label>
      <select id="feedback-type">
        <option value="bug">Bug — something isn't working</option>
        <option value="enhancement">Idea — something that would help</option>
      </select>

      <label class="feedback-label" for="feedback-title">Title</label>
      <input id="feedback-title" type="text" placeholder="Short summary" />

      <label class="feedback-label" for="feedback-body">Details</label>
      <textarea id="feedback-body" rows="6" placeholder="What happened? What did you expect to happen?"></textarea>

      <p id="feedback-note">
        Opens a pre-filled issue on GitHub in your browser — nothing is sent
        until you review and submit it there. Your app version and OS are
        included to help with triage.
      </p>

      <div id="feedback-buttons">
        <button id="feedback-cancel">Cancel</button>
        <button id="feedback-submit">Open on GitHub</button>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
