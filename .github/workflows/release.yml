name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      # Pre-create the release so electron-builder attaches assets to it
      # instead of racing to create one itself — when it does that across
      # multiple artifacts it can create duplicate releases for the same tag.
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Automated release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      # Decodes the release keystore from a repo secret into a runner-local
      # file — never written to the repo. See
      # C:\Users\Dana\.android-keystores\README.txt (local machine, not
      # checked in) for the keystore itself and these exact secret values.
      - name: Decode Android keystore
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.jks", $bytes)

      - name: Build signed Android APK and Play bundle
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat assembleSideloadRelease bundlePlayRelease --console=plain
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}\release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android APK to release
        shell: pwsh
        run: |
          $dest = "Folderminal-${{ github.ref_name }}.apk"
          Copy-Item "android\app\build\outputs\apk\sideload\release\app-sideload-release.apk" $dest
          gh release upload "${{ github.ref_name }}" $dest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Archived for manual inspection even though it's also auto-published
      # below -- not attached to the GitHub release itself (that page is the
      # sideload channel and an .aab isn't directly installable there).
      - name: Upload Play bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab

      # Only runs once PLAY_SERVICE_ACCOUNT_JSON is set as a repo secret --
      # see android/app/build.gradle.kts's `play {}` block (Gradle Play
      # Publisher). Deliberately publishes only the "play"-flavor variant
      # (publishPlayReleaseBundle), never "sideload" -- see the comment
      # above that task in build.gradle.kts for why.
      - name: Decode Play service account key
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        shell: pwsh
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\play-service-account.json" -Value $env:PLAY_SERVICE_ACCOUNT_JSON -Encoding utf8 -NoNewline

      - name: Publish Play bundle to internal testing track
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat publishPlayReleaseBundle --console=plain
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}\release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ runner.temp }}\play-service-account.json
